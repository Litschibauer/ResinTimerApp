<!DOCTYPE html>
<html lang="de">
<link rel="manifest" href="manifest.json">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resin-Timer - Litschibauer</title>
    <meta name="description" content="Ein Live-Zähler, der anzeigt, wann dein Harz in Genshin Impact wieder aufgefüllt wird.">
    <meta name="keywords" content="genshin impact, harz, timer, zähler, auffüllen, nachfüllen">

    <link rel="icon" type="image/png" href="src/favicon.png"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;600;700;800&display=swap&subset=latin-ext" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body>
<div class="jumbotron text-center">
    <h1>Genshin Impact</h2>
        <h2>Resin-Timer</h2>
</div>

<!-- Sprachwahl mit Icon -->
<div class="container mb-3">
    <div class="row justify-content-end">
        <div class="col-auto">
            <div class="input-group">
                <div class="input-group-prepend">
        <span class="input-group-text">
            <img id="flag_icon" src="/src/main/resources/icons/flags/de.svg" alt="lang" style="width: 24px; height: 16px;">
        </span>
                </div>
                <select id="language_selector" class="form-control" onchange="setLanguage()">
                    <option value="de" data-flag="de.svg">Deutsch</option>
                    <option value="en" data-flag="gb.svg">English</option>
                    <option value="fr" data-flag="fr.svg">Français</option>
                </select>
            </div>
        </div>
    </div>
</div>

<!-- Hauptinhalt -->
<div class="container">
    <div class="row">
        <div class="col">
            <div class="input-group">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="actual_resin">Aktuelles Resin (0 - 200)</span>
                </div>
                <input type="number" class="form-control" id="resin" min="0" max="200">
                <button class="btn btn-outline-dark" id="resin_button" onclick="calculateInit()">Berechnen</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="title_top">Aktuelles Harz</div>
            <div class="title_bottom" id="current_resin"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="title_top">Vollständig aufgefüllt in</div>
            <div class="title_bottom" id="refill_time"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="title_top">um</div>
            <div class="title_bottom" id="refill_date"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 text-center mt-3">
            <button class="btn btn-outline-primary" id="download_button" onclick="downloadICS()">Download Reminder</button>
        </div>
    </div>
</div>

<footer class="page-footer fixed-bottom">
    <div class="text-center py-3">
        Kontakt: <a href="mailto:litschibauer@litschibauer.de">litschibauer@litschibauer.de</a> | Diese Webseite ist nicht mit miHoYo verbunden.
    </div>
</footer>

<!-- JavaScript Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.34/moment-timezone-with-data.min.js"></script>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="calendar.js"></script>
<script src="main.js"></script>
</body>
</html>
